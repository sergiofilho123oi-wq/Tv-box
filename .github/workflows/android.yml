name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

# Cancela execuções antigas da mesma branch quando chega um push novo
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # AGP 8.2.2 + Gradle 8.4 exigem JDK 17 (JDK 21 NÃO funciona com Gradle 8.4)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # Aceita TODAS as licenças do SDK sem interação (responde "y" a cada pergunta do sdkmanager).
      # "set +o pipefail": o `yes` morre com SIGPIPE (código 141) quando o sdkmanager termina,
      # e o bash do GitHub Actions usa pipefail por padrão, o que derrubaria o passo à toa.
      - name: Aceitar licenças do Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1
          tail -n 5 /tmp/licenses.log
          if grep -q "not accepted" /tmp/licenses.log; then
            echo "Ainda há licenças não aceitas"; cat /tmp/licenses.log; exit 1
          fi

      # compileSdk = 33 (app/build.gradle.kts): instala a plataforma e as build-tools correspondentes
      - name: Instalar plataforma android-33
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Verificar Gradle Wrapper
        run: |
          test -f gradlew && test -f gradlew.bat \
            && test -f gradle/wrapper/gradle-wrapper.jar \
            && test -f gradle/wrapper/gradle-wrapper.properties \
            || { echo "Faltam arquivos do Gradle Wrapper na raiz do repositório"; ls -la; exit 1; }

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Permissão de execução do gradlew
        run: chmod +x ./gradlew

      - name: Testes unitários (JVM)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build do APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Sempre publica o relatório de testes e o schema do Room (mesmo se algo falhar)
      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publicar schemas do Room (commitar em app/schemas/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-room-schemas
          path: app/schemas
          if-no-files-found: ignore
