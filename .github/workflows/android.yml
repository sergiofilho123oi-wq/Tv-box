name: Android CI (ZIP)

# Versão para repositório que contém o projeto dentro de um .zip na raiz
# (ex.: TVBoxOS_FINAL_CORRIGIDO.zip). O próprio workflow extrai o ZIP e compila.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Se o projeto já estiver extraído na raiz, usa a raiz. Senão extrai o ÚNICO .zip
      # que contenha um gradlew. Falha com mensagem clara se não achar ou se houver mais de um.
      - name: Localizar projeto (extrai o ZIP se necessário)
        shell: bash
        run: |
          if [ -f gradlew ]; then
            DIR="."
          else
            MATCHES=()
            while IFS= read -r -d '' z; do
              if unzip -Z1 "$z" | grep -Eq '(^|/)gradlew$'; then MATCHES+=("$z"); fi
            done < <(find . -maxdepth 1 -type f -name '*.zip' -print0)
            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "::error::Nenhum .zip com o projeto (contendo gradlew) foi encontrado na raiz do repositório."
              ls -la; exit 1
            fi
            if [ "${#MATCHES[@]}" -gt 1 ]; then
              echo "::error::Há mais de um .zip de projeto na raiz: ${MATCHES[*]}. Deixe apenas um."
              exit 1
            fi
            echo "Extraindo ${MATCHES[0]}"
            mkdir -p project
            unzip -q -o "${MATCHES[0]}" -d project
            GW=$(find project -maxdepth 3 -name gradlew | head -n 1)
            if [ -z "$GW" ]; then echo "::error::gradlew não encontrado dentro do ZIP"; exit 1; fi
            DIR=$(dirname "$GW")
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"

      - name: Verificar estrutura e Gradle Wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties \
                   settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo ausente no projeto: $f"
              ls -la
              exit 1
            fi
          done
          echo "Estrutura do projeto e Gradle Wrapper: OK"

      - name: Permissão de execução do gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Verificação estática de recursos
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f tools/check_project.py ]; then python3 tools/check_project.py .; else echo "tools/check_project.py ausente: pulando"; fi

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Aceitar licenças do Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1
          tail -n 5 /tmp/licenses.log
          if grep -q "not accepted" /tmp/licenses.log; then
            echo "Ainda há licenças não aceitas"; cat /tmp/licenses.log; exit 1
          fi

      - name: Instalar plataforma android-33
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build (clean + testDebugUnitTest + assembleDebug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --console=plain --stacktrace

      - name: Confirmar que o APK foi gerado
        working-directory: ${{ env.PROJECT_DIR }}
        run: ls -l app/build/outputs/apk/debug/

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-test-report
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest
            ${{ env.PROJECT_DIR }}/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publicar schemas do Room
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvboxos-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas
          if-no-files-found: ignore
